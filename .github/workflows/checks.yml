name: Songsketch checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the release ingredients
        run: python scripts/check-install.py
      - name: Exercise local contracts and recovery
        run: python -m unittest discover -s tests -v
      - name: Check artwork import contracts
        run: python -m unittest discover -s artwork/tools -p 'test_*.py' -v
      - name: Check offline QA report privacy
        run: node --test tests/test_qa_report.js
      - name: Check shell helpers
        shell: bash
        run: |
          for file in scripts/*.sh ./*.command; do bash -n "$file"; done
