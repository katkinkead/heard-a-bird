<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Songsketch · the garden</title>
  <link rel="stylesheet" href="/static/display.css">
  <script src="/static/display-reports.js" defer></script>
  <script src="/static/display.js" defer></script>
</head>
<body>
  <main id="canvas-stage" aria-label="Songsketch bird painting">
    <p id="welcome">A little space for the birds.</p>
    <div id="paintings"></div>
    <div id="progress" role="progressbar" aria-label="Painting progress" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0" hidden><span></span></div>
    <aside id="annotation" aria-live="polite" aria-atomic="true" hidden>
      <svg id="status-icon" viewBox="0 0 100 58" aria-hidden="true"><use href="#mark-leaf"></use></svg>
      <span id="status-label"></span>
    </aside>
  </main>
  <nav aria-label="Display controls"><a href="/dashboard">Garden notebook</a><button type="button" id="fullscreen">Full screen</button></nav>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="mark-ripple" viewBox="0 0 100 58"><g fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="50" cy="32" rx="42" ry="15"/><ellipse cx="50" cy="29" rx="26" ry="9"/></g><circle cx="50" cy="26" r="4" fill="currentColor"/></symbol>
      <symbol id="mark-leaf" viewBox="0 0 100 58"><path d="M39 47C39 26 48 16 72 9C68 32 59 43 39 47ZM34 52L64 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="mark-memory" viewBox="0 0 100 58"><ellipse cx="50" cy="29" rx="35" ry="24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 5"/><path d="M47 46Q52 29 45 18M49 34Q35 32 33 17Q47 21 49 34M50 31Q61 15 72 14Q69 29 50 31" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="mark-pie" viewBox="0 0 100 58"><path d="M10 28L14 43Q29 53 45 43L50 28" fill="#d9b278" stroke="#31535a" stroke-width="1.4"/><ellipse cx="30" cy="27" rx="22" ry="13" fill="#efcb87" stroke="#31535a" stroke-width="1.4"/><path d="M10 24Q12 18 16 19Q18 13 22 16Q26 11 30 15Q35 11 38 16Q44 14 45 20Q51 19 50 26M24 28L29 23M33 29L38 24" fill="none" stroke="#9d6f3b" stroke-width="1.8" stroke-linecap="round"/><path d="M50 34Q56 38 63 35M86 35L97 37" fill="none" stroke="#31535a" stroke-width="2"/><path d="M62 31H70V39H62ZM82 31H89V39H82M70 33H74M70 37H74" fill="#81a6a5" stroke="#31535a" stroke-width="1.3"/></symbol>
      <symbol id="mark-microphone" viewBox="0 0 100 58"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="43" y="8" width="14" height="28" rx="7"/><path d="M37 26V30A13 13 0 0 0 63 30V26M50 43V51M41 51H59"/></g><path d="M34 48L67 10" stroke="#b95b3e" stroke-width="2.2"/></symbol>
      <symbol id="mark-offline" viewBox="0 0 100 58"><path d="M18 35H40M61 35H83M37 29V41M64 29V41M46 27L54 18M47 43L56 49" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>
</body>
</html>
